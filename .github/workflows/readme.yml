name: readme

on:
  schedule:
    - cron: "17 9 * * *" # daily, 06:17 in Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - content.json
      - scripts/**
      - .github/workflows/readme.yml

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      # GH_STATS_TOKEN (opcional): um token pessoal com read:user conta também
      # contribuições privadas. Sem ele, usa o GITHUB_TOKEN e só o que é público.
      - name: Gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/build.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "activity: $(date -u +%F)"
          git push
